name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:drills
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # axe on the real screens and dialogs + token contrast (already part of `npm test`, repeated for a clear failure signal)
      - run: npm run a11y
      - run: npm run build
